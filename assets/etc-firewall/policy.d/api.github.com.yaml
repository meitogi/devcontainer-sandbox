# Purpose: GitHub REST API rules — restrict to anthropics/* repo metadata reads.
# Blocks gist + repo contents (file blob) endpoints to prevent arbitrary data exfil.
# Consumed by A2 mitmproxy addons.

endpoints:
  - path: "^/repos/anthropics/[\\w.-]+$"
    methods: [GET]
    query_params: {}

  - path: "^/repos/anthropics/[\\w.-]+/(branches|tags|commits|releases|contents)$"
    methods: [GET]
    query_params:
      per_page: { type: int, min: 1, max: 100 }
      sha:      { type: string, max_length: 40, pattern: "^[a-f0-9]+$" }

  - path: "^/orgs/anthropics(/.*)?$"
    methods: [GET]

  # Source tarball of an arbitrary repository, for the extension-patch hook
  # (assets/opt/hooks/*/45-ext-patches.sh). Deliberately owner-agnostic: the
  # image ships no default repository and must not name one, so this cannot be
  # pinned to a single owner. Narrow on purpose — the tarball endpoint only,
  # GET only, a ref segment required. It grants no contents API, no gist, no
  # git protocol and no write verb. The 302 it returns lands on
  # codeload.github.com, allowed by its own policy file.
  - path: "^/repos/[\\w.-]+/[\\w.-]+/tarball/.+$"
    methods: [GET]

  # Which refs exist, for `ext-patches-update` — the command that moves a
  # container from one pinned patch set to the next. Owner-agnostic for the
  # same reason as the tarball above: the image names no repository.
  #
  # Two paths, not a prefix. `releases/latest` is the polite answer; `tags` is
  # the one that actually runs, because a repository can carry git tags and no
  # GitHub release at all. `^/repos/.../releases$` is NOT granted: the plural
  # form pages every release body, which is a lot of arbitrary text for a
  # question whose answer is one ref name.
  #
  # Still GET only, still no contents API, no gist, no git protocol, no write
  # verb, and entirely inert without a token.
  - path: "^/repos/[\\w.-]+/[\\w.-]+/(releases/latest|tags)$"
    methods: [GET]
    query_params:
      per_page: { type: int, min: 1, max: 100 }

blocked_paths:
  - "^/gists"
  # Note: removed `^/repos/(?!anthropics/)` — redundant defense-in-depth
  # when `endpoints` is non-empty. policy_enforce.py already returns 403
  # `endpoint_not_matched` for any /repos/* path that doesn't match a
  # synthesized endpoint. Removing the line unblocks paths contributed by
  # domains.d/<eco>.txt extracts (composer, future ecosystems) for orgs
  # outside anthropics, while keeping default-deny intact.

# GitHub REST API standard header prefixes. `X-GitHub-Api-Version` is
# required for stable behaviour ; rate-limit / OAuth are GitHub-specific.
# Allowed only here (and on github.com / codeload) so they can't be reused.
allowed_header_patterns:
  - "^X-(GitHub|RateLimit|Accepted-OAuth|OAuth)-?"
