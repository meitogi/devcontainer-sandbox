# Publish ghcr.io/meitogi/devcontainer-sandbox:<base>-cc<cc>
#
# One multi-arch image per Claude Code version listed in cc-versions.json.
# The base version comes from package.json — bump it there before tagging.
# Third-party actions are pinned to commit SHAs (comment = tag at pin time,
# 2026-08-01); bump deliberately, never float.
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      cc-versions: ${{ steps.meta.outputs.cc-versions }}
      base-version: ${{ steps.meta.outputs.base-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: meta
        run: |
          echo "cc-versions=$(jq -c '.versions' cc-versions.json)" >> "$GITHUB_OUTPUT"
          echo "base-version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
      - name: tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          v="$(jq -r '.version' package.json)"
          if [ "${GITHUB_REF_NAME}" != "v${v}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != package.json version v${v} — bump package.json first"
            exit 1
          fi

  publish:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: ${{ fromJSON(needs.setup.outputs.cc-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CLAUDE_CODE_VERSION=${{ matrix.cc }}
            BASE_VERSION=${{ needs.setup.outputs.base-version }}
          tags: ghcr.io/meitogi/devcontainer-sandbox:${{ needs.setup.outputs.base-version }}-cc${{ matrix.cc }}
